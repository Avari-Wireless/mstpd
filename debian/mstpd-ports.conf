# /etc/mstpd-ports.conf - per-port spanning-tree settings that mstpd applies
# itself every time a port joins a bridge (TEN-8786). A port that leaves and
# rejoins - a recreated tunnel, a NetworkManager reconnect - gets them again,
# which settings made afterwards with mstpctl do not.
#
# Format: <bridge> <port> <setting>=<value>...
#   - bridge and port are shell-style patterns (fnmatch); every matching line
#     applies, in file order.
#   - settings, as mstpctl: adminedge autoedge bpduguard bpdufilter restrrole
#     restrtcn network dontxmt (yes|no), p2p (yes|no|auto).
#   - an unknown setting is logged and skipped; the rest of its line applies.
# Bridge-wide settings (protocol, priority) are not set here - on the DMC the
# NetworkManager hook /etc/NetworkManager/dispatcher.d/22-lanbr0-rstp does that.
#
# DMC policy: NO per-port rules, deliberately.
#   - Topology A (physical server, redundant ring) is the only DMC topology that
#     runs RSTP on lanbr0, and every lanbr0 member there is a ring/fronthaul
#     link towards the units. Those are the loops RSTP exists to break, so they
#     must stay full (non-edge) RSTP ports - mstpd's defaults.
#   - Topologies B (VM) and C (cloud, GRETAP tunnel) run lanbr0 with STP off,
#     so mstpd does not manage the bridge and nothing here applies.
# The units carry their own policy (meta-avari-bsp lanbr0-rstp): their copper
# access ports are edge, their gt-* tunnel ports edge + BPDU guard.
#
# Example, should a Topology A DMC ever gain a dedicated access port that only
# hosts plug into (portfast; a BPDU demotes it back to full RSTP):
#   lanbr0 enp7s0 adminedge=yes autoedge=yes
